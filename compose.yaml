name: tallymark

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "${APP_PORT:-8060}:80"
    volumes:
      - .:/var/www/html
      - composer_cache:/root/.composer
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8060}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-tallymark}
      DB_USERNAME: ${DB_USERNAME:-tallymark}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_ENCRYPTION: "null"
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@tallymark.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-TallyMark}
    env_file:
      - path: .env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysql:
    image: mysql:8.0
    ports:
      - "${MYSQL_PORT:-3309}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-tallymark}
      MYSQL_USER: ${DB_USERNAME:-tallymark}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8045}:8025"
      - "${MAILPIT_SMTP_PORT:-1026}:1025"

  demosite:
    build:
      context: .
      dockerfile: docker/demosite/Dockerfile
    ports:
      - "${DEMOSITE_PORT:-8065}:80"

  node:
    profiles:
      - dev
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - .:/var/www/html
      - npm_cache:/root/.npm
    environment:
      VITE_DEV_SERVER_HOST: 0.0.0.0

volumes:
  mysql_data:
  composer_cache:
  npm_cache:
